apiVersion: v1
kind: Namespace
metadata:
  name: z-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-core-gateway
  namespace: z-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: z-core-gateway
  template:
    metadata:
      labels:
        app: z-core-gateway
    spec:
      containers:
      - name: gateway
        image: netsecurepro/z-core:22.0.0
        ports:
        - containerPort: 8443
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: z-core-svc
  namespace: z-core
spec:
  selector:
    app: z-core-gateway
  ports:
  - port: 8443
    targetPort: 8443
  type: ClusterIP
